global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'eyeclub-microservices'
    metrics_path: '/api/v1/microservices/health'
    static_configs:
      - targets:
          - 'api:4000'
          - 'identity-tenant-service:4001'
          - 'catalog-tryon-service:4002'
          - 'commerce-order-service:4003'
          - 'clinical-store-service:4004'
          - 'pos-lab-service:4005'
